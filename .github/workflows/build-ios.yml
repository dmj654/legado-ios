name: Build iOS IPA

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build-ios:
    name: Build Unsigned iOS IPA
    runs-on: macos-latest
    timeout-minutes: 60

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Select Xcode
        run: |
          xcodebuild -version
          xcodebuild -showsdks | grep -i iphoneos || true

      - name: Build iOS App (Release, arm64)
        run: |
          cd iosApp
          xcodebuild \
            -project Legado.xcodeproj \
            -scheme Legado \
            -configuration Release \
            -sdk iphoneos \
            -destination 'generic/platform=iOS' \
            -archivePath "$PWD/build/Legado.xcarchive" \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_ALLOWED=NO \
            ONLY_ACTIVE_ARCH=NO \
            clean archive

      - name: Create Unsigned IPA
        run: |
          cd iosApp
          mkdir -p build/Payload
          cp -R build/Legado.xcarchive/Products/Applications/Legado.app build/Payload/
          cd build
          zip -qr Legado-unsigned.ipa Payload
          ls -lh Legado-unsigned.ipa

      - name: Upload IPA Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Legado-unsigned-ipa
          path: iosApp/build/Legado-unsigned.ipa
          retention-days: 30
