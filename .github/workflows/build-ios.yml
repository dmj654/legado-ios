name: Build iOS IPA

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build-ios:
    name: Build Unsigned iOS IPA
    runs-on: macos-latest
    timeout-minutes: 60

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Cache Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: ${{ runner.os }}-gradle-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties') }}
          restore-keys: |
            ${{ runner.os }}-gradle-

      - name: Build KMP Shared Framework (iOS)
        run: |
          cd legado-kmp
          if [ -f "gradlew" ]; then
            chmod +x gradlew
            ./gradlew :shared:linkReleaseFrameworkIosArm64 --no-daemon || echo "KMP framework build skipped (may need more setup)"
          else
            echo "No gradlew found, skipping KMP build"
          fi

      - name: Select Xcode
        run: |
          xcodebuild -version
          xcodebuild -showsdks | grep -i iphoneos || true

      - name: Build iOS App (Release, arm64)
        run: |
          cd legado-kmp/iosApp
          xcodebuild \
            -project Legado.xcodeproj \
            -scheme Legado \
            -configuration Release \
            -sdk iphoneos \
            -destination 'generic/platform=iOS' \
            -archivePath "$PWD/build/Legado.xcarchive" \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_ALLOWED=NO \
            ONLY_ACTIVE_ARCH=NO \
            clean archive

      - name: Create Unsigned IPA
        run: |
          cd legado-kmp/iosApp
          mkdir -p build/Payload
          cp -R build/Legado.xcarchive/Products/Applications/Legado.app build/Payload/
          cd build
          zip -qr Legado-unsigned.ipa Payload
          ls -lh Legado-unsigned.ipa
          echo "IPA_PATH=$PWD/Legado-unsigned.ipa" >> $GITHUB_ENV

      - name: Upload IPA Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Legado-unsigned-ipa
          path: legado-kmp/iosApp/build/Legado-unsigned.ipa
          retention-days: 30

      - name: Upload XCArchive (optional debug)
        uses: actions/upload-artifact@v4
        with:
          name: Legado-xcarchive
          path: legado-kmp/iosApp/build/Legado.xcarchive
          retention-days: 7
